<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IntelliCrew — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2.5rem;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .logo h1 { font-size: 1.7rem; color: #1a237e; font-weight: 700; }
    .logo p  { font-size: 0.85rem; color: #888; margin-top: 0.3rem; }

    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.3rem; font-weight: 600; }
    .field { margin-bottom: 1.2rem; }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #3949ab; }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: #1a237e;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #283593; }
    button[type="submit"]:disabled { background: #9fa8da; cursor: not-allowed; }

    #error-msg {
      margin-top: 1rem;
      padding: 0.6rem 0.8rem;
      background: #ffebee;
      color: #c62828;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>IntelliCrew</h1>
      <p>Employee Skills Portal</p>
    </div>
    <form id="login-form">
      <div class="field">
        <label for="email">Work Email</label>
        <input type="email" id="email" placeholder="you@company.com" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required/>
      </div>
      <button type="submit" id="login-btn">Login</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const errDiv = document.getElementById("error-msg");
      errDiv.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = "/dashboard";
      } else {
        errDiv.textContent = data.error || "Login failed";
        errDiv.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
